# RustLLMroute example configuration. The shape is LiteLLM-compatible.
# Values written as os.environ/NAME are read from the environment (or the environment_variables map).

model_list:
  # Two deployments under one public name form a load-balanced group.
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      rpm: 500
      weight: 2
  - model_name: gpt-4o
    litellm_params:
      model: azure/my-gpt-4o-deployment
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: "2024-10-21"
    model_info:
      base_model: gpt-4o
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  - model_name: llama-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
  # Wildcard: any model name starting with "openrouter/" is forwarded with the suffix.
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: local-llama
    litellm_params:
      model: ollama/llama3.2
      api_base: http://localhost:11434/v1
  # Google, Vertex AI and AWS Bedrock (see docs/providers.md); uncomment and set the credentials.
  # - model_name: gemini-flash
  #   litellm_params:
  #     model: gemini/gemini-2.5-flash
  #     api_key: os.environ/GEMINI_API_KEY
  # - model_name: claude-vertex
  #   litellm_params:
  #     model: vertex_ai/claude-sonnet-4-5@20250929
  #     vertex_project: os.environ/VERTEXAI_PROJECT
  #     vertex_location: us-east5
  #     vertex_credentials: os.environ/GOOGLE_APPLICATION_CREDENTIALS
  # - model_name: claude-bedrock
  #   litellm_params:
  #     model: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
  #     aws_region_name: us-east-1

litellm_settings:
  drop_params: true
  num_retries: 2
  callbacks: ["prometheus"]

router_settings:
  routing_strategy: simple-shuffle
  cooldown_time: 30
  allowed_fails: 3
  fallbacks: [{"gpt-4o": ["gpt-4o-mini"]}]
  model_group_alias: {"gpt-4": "gpt-4o"}

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # background_health_checks: true   # probe every deployment each health_check_interval seconds (default 300)
  database_url: os.environ/DATABASE_URL
  metrics_auth: false
  maximum_spend_logs_retention_period: "90d"

environment_variables:
  # Defaults used when the variable is absent from the process environment.
  AZURE_API_BASE: https://example.openai.azure.com
  AZURE_API_KEY: replace-me
  DATABASE_URL: sqlite://./data/rustllmroute.db

